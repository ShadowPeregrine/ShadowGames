<!DOCTYPE html>
<html>
<head>
  <title>Shadow Typing Race PvP</title>
  <style>
    body{font-family:Arial;text-align:center;background:#0f172a;color:white;margin:0;padding:20px}
    input,button{font-size:18px;padding:10px;margin:6px;border-radius:10px}
    button{background:#2563eb;color:white;border:0;cursor:pointer}
    .box{background:#1e293b;padding:20px;border-radius:16px;max-width:800px;margin:20px auto}
    .word{font-size:42px;color:#22c55e;font-weight:bold}
    .players{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
    .player{background:#334155;padding:15px;border-radius:12px;width:250px}
  </style>
</head>
<body>

<h1>Shadow Typing Race PvP ⚡</h1>

<div class="box">
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Room code">
  <br>
  <button onclick="createRoom()">Create Room</button>
  <button onclick="joinRoom()">Join Room</button>
  <button onclick="startRace()">Start Race</button>
</div>

<div class="box">
  <h2>Room: <span id="roomShow">None</span></h2>
  <h2>Status: <span id="status">Not joined</span></h2>
  <div class="word" id="word">---</div>
  <input id="answer" placeholder="type word here" autocomplete="off">
</div>

<div class="box">
  <h2>Players</h2>
  <div class="players" id="players"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const words = [
  "cat","dog","sun","apple","school","dragon","planet","keyboard","cookie","shadow",
  "rocket","tiger","banana","purple","winter","castle","speed","winner","typing","race"
];

let roomCode = "";
let playerId = "";
let playerName = "";
let currentIndex = 0;
let currentWords = [];

const nameInput = document.getElementById("name");
const roomInput = document.getElementById("room");
const roomShow = document.getElementById("roomShow");
const statusText = document.getElementById("status");
const wordBox = document.getElementById("word");
const answer = document.getElementById("answer");
const playersBox = document.getElementById("players");

function randomRoom(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

function shuffle(arr){
  return arr.sort(() => Math.random() - 0.5);
}

window.createRoom = async function(){
  playerName = nameInput.value || "Player";
  roomCode = randomRoom();
  playerId = Date.now().toString();

  currentWords = shuffle([...words]).slice(0,10);

  await setDoc(doc(db,"rooms",roomCode),{
    started:false,
    winner:"",
    words:currentWords
  });

  await setDoc(doc(db,"rooms",roomCode,"players",playerId),{
    name:playerName,
    score:0,
    finished:false
  });

  setupRoom();
};

window.joinRoom = async function(){
  playerName = nameInput.value || "Player";
  roomCode = roomInput.value.trim().toUpperCase();
  playerId = Date.now().toString();

  const roomRef = doc(db,"rooms",roomCode);
  const snap = await getDoc(roomRef);

  if(!snap.exists()){
    alert("Room not found!");
    return;
  }

  await setDoc(doc(db,"rooms",roomCode,"players",playerId),{
    name:playerName,
    score:0,
    finished:false
  });

  setupRoom();
};

function setupRoom(){
  roomShow.innerText = roomCode;
  statusText.innerText = "Joined";
  answer.focus();

  onSnapshot(doc(db,"rooms",roomCode), snap=>{
    const data = snap.data();
    if(!data) return;

    currentWords = data.words || [];

    if(data.started){
      statusText.innerText = data.winner ? "Winner: " + data.winner : "Race started!";
      showWord();
    }else{
      statusText.innerText = "Waiting to start";
      wordBox.innerText = "---";
    }
  });

  onSnapshot(collection(db,"rooms",roomCode,"players"), snap=>{
    playersBox.innerHTML = "";
    snap.forEach(docSnap=>{
      const p = docSnap.data();
      const div = document.createElement("div");
      div.className = "player";
      div.innerHTML = `<h3>${p.name}</h3><p>Score: ${p.score}/10</p>`;
      playersBox.appendChild(div);
    });
  });
}

window.startRace = async function(){
  if(!roomCode) return alert("Join or create a room first!");
  await updateDoc(doc(db,"rooms",roomCode),{
    started:true,
    winner:""
  });
};

function showWord(){
  wordBox.innerText = currentWords[currentIndex] || "FINISHED!";
}

answer.addEventListener("input", async ()=>{
  if(!roomCode || currentWords.length===0) return;

  const typed = answer.value.trim().toLowerCase();
  const target = currentWords[currentIndex];

  if(typed === target){
    currentIndex++;
    answer.value = "";

    await updateDoc(doc(db,"rooms",roomCode,"players",playerId),{
      score:currentIndex
    });

    if(currentIndex >= currentWords.length){
      await updateDoc(doc(db,"rooms",roomCode,"players",playerId),{
        finished:true
      });

      await updateDoc(doc(db,"rooms",roomCode),{
        winner:playerName
      });

      wordBox.innerText = "YOU FINISHED!";
    }else{
      showWord();
    }
  }
});
</script>

</body>
</html>
