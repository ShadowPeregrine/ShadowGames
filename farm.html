<!DOCTYPE html>
<html>
<head>
  <title>Shadow Farm</title>
  <style>
    body{margin:0;background:#d9f99d;color:#14532d;font-family:Arial;text-align:center}
    h1{font-size:48px;color:#166534}
    .box{background:#f7fee7;border:4px solid #65a30d;border-radius:18px;margin:16px auto;padding:16px;width:min(1000px,95vw)}
    button{padding:10px 14px;margin:6px;border:0;border-radius:10px;background:#22c55e;color:white;font-weight:bold;cursor:pointer}
    button:hover{background:#16a34a}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .card{background:white;border:2px solid #84cc16;border-radius:14px;padding:12px}
  </style>
</head>
<body>

<h1>Shadow Farm 🌾</h1>

<div class="box">
  <h2>Money: $<span id="money">100</span></h2>
  <p>Farm Level: <span id="farmLevel">1</span> | Barn Level: <span id="barnLevel">1</span> | Market Level: <span id="marketLevel">1</span></p>
  <p>Crop Slots: <span id="cropSlots">3</span> | Animal Slots: <span id="animalSlots">2</span></p>
</div>

<div class="box">
  <h2>🌱 Seeds</h2>
  <div id="seeds" class="grid"></div>
</div>

<div class="box">
  <h2>🌾 Growing Crops</h2>
  <div id="crops" class="grid"></div>
</div>

<div class="box">
  <h2>🐄 Animals</h2>
  <div id="animals" class="grid"></div>
</div>

<div class="box">
  <h2>🐶 Pets</h2>
  <div id="pets" class="grid"></div>
</div>

<div class="box">
  <h2>🛒 Market / Upgrades</h2>
  <button onclick="sellAll()">Sell All Goods</button>
  <button onclick="upgradeFarm()">🌾 Upgrade Farm (+2 crop slots)</button>
  <button onclick="upgradeBarn()">🐄 Upgrade Barn (+2 animal slots)</button>
  <button onclick="upgradeMarket()">🛒 Upgrade Market (+5% selling prices)</button>
  <button onclick="restartGame()">Restart</button>
</div>

<div class="box">
  <h2>📦 Inventory</h2>
  <p id="inventory"></p>
</div>

<script>
let money = 100;
let farmLevel = 1;
let barnLevel = 1;
let marketLevel = 1;

let cropSlots = 3;
let animalSlots = 2;

let inventory = {};
let planted = [];
let ownedAnimals = [];
let ownedPets = [];

const seeds = [
  {name:"Carrot", emoji:"🥕", cost:10, grow:5, sell:25},
  {name:"Wheat", emoji:"🌾", cost:25, grow:8, sell:60},
  {name:"Corn", emoji:"🌽", cost:60, grow:12, sell:150},
  {name:"Pumpkin", emoji:"🎃", cost:150, grow:18, sell:400},
  {name:"Watermelon", emoji:"🍉", cost:400, grow:25, sell:1000},
  {name:"Golden Apple", emoji:"🍏", cost:1200, grow:35, sell:3500},
  {name:"Crystal Berry", emoji:"💎", cost:5000, grow:45, sell:15000}
];

const animalTypes = [
  {name:"Chicken", emoji:"🐔", cost:100, product:"Egg", productEmoji:"🥚", value:25, time:6},
  {name:"Cow", emoji:"🐄", cost:500, product:"Milk", productEmoji:"🥛", value:150, time:10},
  {name:"Sheep", emoji:"🐑", cost:1200, product:"Wool", productEmoji:"🧶", value:400, time:14},
  {name:"Pig", emoji:"🐖", cost:3000, product:"Truffle", productEmoji:"🍄", value:1000, time:18},
  {name:"Horse", emoji:"🐎", cost:8000, product:"Race Medal", productEmoji:"🏅", value:2500, time:25},
  {name:"Dragon", emoji:"🐉", cost:25000, product:"Dragon Scale", productEmoji:"🔥", value:9000, time:35}
];

const petTypes = [
  {name:"Dog", emoji:"🐶", cost:250, bonus:"Crops sell +5%"},
  {name:"Cat", emoji:"🐱", cost:500, bonus:"Animals produce +5%"},
  {name:"Rabbit", emoji:"🐰", cost:1000, bonus:"Seeds cost -5%"},
  {name:"Fox", emoji:"🦊", cost:2500, bonus:"Market bonus +10%"},
  {name:"Unicorn", emoji:"🦄", cost:10000, bonus:"Everything sells +25%"}
];

function format(n){
  if(n>=1e9)return (n/1e9).toFixed(2)+"B";
  if(n>=1e6)return (n/1e6).toFixed(2)+"M";
  if(n>=1e3)return (n/1e3).toFixed(2)+"K";
  return Math.floor(n);
}

function addItem(name, amount){
  inventory[name] = (inventory[name] || 0) + amount;
}

function petSellBonus(){
  let bonus = 1;
  ownedPets.forEach(p=>{
    if(p.name==="Dog") bonus += 0.05;
    if(p.name==="Fox") bonus += 0.10;
    if(p.name==="Unicorn") bonus += 0.25;
  });
  return bonus;
}

function seedDiscount(){
  let discount = 1;
  ownedPets.forEach(p=>{
    if(p.name==="Rabbit") discount -= 0.05;
  });
  return Math.max(0.5, discount);
}

function animalBonus(){
  let bonus = 1;
  ownedPets.forEach(p=>{
    if(p.name==="Cat") bonus += 0.05;
    if(p.name==="Unicorn") bonus += 0.25;
  });
  return bonus;
}

function plant(seedIndex){
  if(planted.length >= cropSlots) return alert("No crop slots!");
  let s = seeds[seedIndex];
  let cost = Math.floor(s.cost * seedDiscount());
  if(money < cost) return alert("Not enough money!");

  money -= cost;
  planted.push({...s,left:s.grow});
  update();
}

function harvest(i){
  let crop = planted[i];
  if(crop.left > 0) return;

  addItem(crop.name,1);
  planted.splice(i,1);
  update();
}

function buyAnimal(i){
  if(ownedAnimals.length >= animalSlots) return alert("Barn is full!");
  let a = animalTypes[i];
  if(money < a.cost) return alert("Not enough money!");

  money -= a.cost;
  ownedAnimals.push({...a,left:a.time,stored:0});
  update();
}

function collectAnimal(i){
  let a = ownedAnimals[i];
  if(a.stored <= 0) return;

  let amount = a.stored * Math.max(1, Math.floor(animalBonus()));
  addItem(a.product, amount);
  a.stored = 0;
  update();
}

function buyPet(i){
  let p = petTypes[i];
  if(ownedPets.find(x=>x.name===p.name)) return alert("You already own this pet!");
  if(money < p.cost) return alert("Not enough money!");

  money -= p.cost;
  ownedPets.push(p);
  update();
}

function sellAll(){
  let total = 0;

  for(let item in inventory){
    let crop = seeds.find(s=>s.name===item);
    let animal = animalTypes.find(a=>a.product===item);

    let value = 0;
    if(crop) value = crop.sell;
    if(animal) value = animal.value;

    total += inventory[item] * value;
  }

  total *= (1 + marketLevel * 0.05);
  total *= petSellBonus();

  money += total;
  inventory = {};
  update();
}

function upgradeFarm(){
  let cost = farmLevel * 500;
  if(money < cost) return alert("Need $" + cost);

  money -= cost;
  farmLevel++;
  cropSlots += 2;
  update();
}

function upgradeBarn(){
  let cost = barnLevel * 1000;
  if(money < cost) return alert("Need $" + cost);

  money -= cost;
  barnLevel++;
  animalSlots += 2;
  update();
}

function upgradeMarket(){
  let cost = marketLevel * 1500;
  if(money < cost) return alert("Need $" + cost);

  money -= cost;
  marketLevel++;
  update();
}

function restartGame(){
  if(confirm("Restart farm?")){
    localStorage.removeItem("shadowFarm");
    location.reload();
  }
}

function tick(){
  planted.forEach(c=>{
    if(c.left>0)c.left--;
  });

  ownedAnimals.forEach(a=>{
    if(a.stored === undefined) a.stored = 0;

    if(a.left>0){
      a.left--;
    }else{
      a.stored++;
      a.left = a.time;
    }
  });

  update();
}

function renderSeeds(){
  let box = document.getElementById("seeds");
  box.innerHTML = "";

  seeds.forEach((s,i)=>{
    let cost = Math.floor(s.cost * seedDiscount());
    box.innerHTML += `
      <div class="card">
        <h3>${s.emoji} ${s.name}</h3>
        <p>Cost: $${format(cost)}</p>
        <p>Grow: ${s.grow}s</p>
        <p>Sell: $${format(s.sell)}</p>
        <button onclick="plant(${i})">Plant</button>
      </div>
    `;
  });
}

function renderCrops(){
  let box = document.getElementById("crops");
  box.innerHTML = "";

  if(planted.length===0){
    box.innerHTML = "<p>No crops planted.</p>";
    return;
  }

  planted.forEach((c,i)=>{
    box.innerHTML += `
      <div class="card">
        <h3>${c.emoji} ${c.name}</h3>
        <p>${c.left>0 ? "Ready in: "+c.left+"s" : "Ready!"}</p>
        <button onclick="harvest(${i})">Harvest</button>
      </div>
    `;
  });
}

function renderAnimals(){
  let box = document.getElementById("animals");
  box.innerHTML = "<h3>Buy Animals</h3>";

  animalTypes.forEach((a,i)=>{
    box.innerHTML += `
      <div class="card">
        <h3>${a.emoji} ${a.name}</h3>
        <p>Cost: $${format(a.cost)}</p>
        <p>Produces: ${a.productEmoji} ${a.product}</p>
        <p>Every ${a.time}s</p>
        <button onclick="buyAnimal(${i})">Buy</button>
      </div>
    `;
  });

  box.innerHTML += "<h3>Your Animals</h3>";

  ownedAnimals.forEach((a,i)=>{
    if(a.stored === undefined) a.stored = 0;

    box.innerHTML += `
      <div class="card">
        <h3>${a.emoji} ${a.name}</h3>
        <p>Next ${a.product}: ${a.left}s</p>
        <p>Stored ${a.product}: ${a.stored}</p>
        <button onclick="collectAnimal(${i})">Collect All</button>
      </div>
    `;
  });
}

function renderPets(){
  let box = document.getElementById("pets");
  box.innerHTML = "";

  petTypes.forEach((p,i)=>{
    let owned = ownedPets.find(x=>x.name===p.name);
    box.innerHTML += `
      <div class="card">
        <h3>${p.emoji} ${p.name}</h3>
        <p>${p.bonus}</p>
        <p>Cost: $${format(p.cost)}</p>
        <button onclick="buyPet(${i})">${owned ? "Owned" : "Buy"}</button>
      </div>
    `;
  });
}

function updateInventory(){
  let text = "";
  for(let item in inventory){
    text += item + ": " + inventory[item] + " | ";
  }
  document.getElementById("inventory").innerText = text || "Empty";
}

function update(){
  document.getElementById("money").innerText = format(money);
  document.getElementById("farmLevel").innerText = farmLevel;
  document.getElementById("barnLevel").innerText = barnLevel;
  document.getElementById("marketLevel").innerText = marketLevel;
  document.getElementById("cropSlots").innerText = cropSlots;
  document.getElementById("animalSlots").innerText = animalSlots;

  renderSeeds();
  renderCrops();
  renderAnimals();
  renderPets();
  updateInventory();

  saveGame();
}

function saveGame(){
  localStorage.setItem("shadowFarm",JSON.stringify({
    money,farmLevel,barnLevel,marketLevel,cropSlots,animalSlots,
    inventory,planted,ownedAnimals,ownedPets
  }));
}

function loadGame(){
  let save = JSON.parse(localStorage.getItem("shadowFarm"));
  if(save){
    money = save.money ?? 100;
    farmLevel = save.farmLevel ?? 1;
    barnLevel = save.barnLevel ?? 1;
    marketLevel = save.marketLevel ?? 1;
    cropSlots = save.cropSlots ?? 3;
    animalSlots = save.animalSlots ?? 2;
    inventory = save.inventory ?? {};
    planted = save.planted ?? [];
    ownedAnimals = save.ownedAnimals ?? [];
    ownedPets = save.ownedPets ?? [];

    ownedAnimals.forEach(a=>{
      if(a.stored === undefined) a.stored = 0;
    });
  }
}

loadGame();
update();
setInterval(tick,1000);
</script>

</body>
</html>
