<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Platformer</title>
  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    canvas {
      display: block;
      margin: 20px auto;
      background: linear-gradient(#6ec6ff, #dff6ff);
      border: 4px solid white;
      max-width: 95vw;
    }

    .hud {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Shadow Platformer</h1>
  <p>Move: A/D or Arrow Keys | Jump: W / Up / Space | Rewind: Shift | Restart: R</p>

  <div class="hud">
    Level: <span id="level">1</span> / 50 |
    Deaths: <span id="deaths">0</span> |
    Shadow: <span id="shadow">Ready</span>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const levelText = document.getElementById("level");
    const deathsText = document.getElementById("deaths");
    const shadowText = document.getElementById("shadow");

    const keys = {};
    const justPressed = {};

    let level = 0;
    let deaths = 0;
    let checkpoint = { x: 50, y: 300 };
    let trail = [];
    let rewinding = false;
    let shadowCooldown = 0;

    const player = {
      x: 50,
      y: 300,
      w: 30,
      h: 40,
      vx: 0,
      vy: 0,
      speed: 5,
      jump: 12,
      grounded: false
    };

    const levels = [];

    for (let i = 1; i <= 50; i++) {
      levels.push({
        platforms: [
          { x: 0, y: 370, w: 150, h: 30 },
          { x: 180, y: 320 - (i % 3) * 10, w: 90, h: 20 },
          { x: 350, y: 280 - (i % 4) * 10, w: 90, h: 20 },
          { x: 520, y: 240 - (i % 5) * 10, w: 90, h: 20 },
          { x: 680, y: 200 - (i % 6) * 8, w: 90, h: 20 }
        ],
        moving: [
          {
            x: 250,
            y: 250,
            w: 80,
            h: 15,
            dir: 1,
            min: 150,
            max: 350,
            speed: 1 + i * 0.05
          }
        ],
        enemies: [
          {
            x: 300,
            y: 350,
            w: 30,
            h: 20,
            dir: 1,
            min: 200,
            max: 600,
            speed: 1 + i * 0.05
          }
        ],
        spikes: [
          { x: 150, y: 350, w: 60, h: 20 },
          { x: 400, y: 350, w: 60, h: 20 }
        ],
        checkpoint: { x: 600, y: 330, w: 20, h: 40 },
        goal: { x: 740, y: 140, w: 40, h: 40 },
        boss: i === 50
      });
    }

    document.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (!keys[key]) justPressed[key] = true;
      keys[key] = true;
    });
