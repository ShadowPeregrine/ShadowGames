<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Platformer Worlds</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;text-align:center;font-family:Arial,sans-serif}
h1{margin:14px 0 4px;font-size:40px}
p{margin:6px;color:#cbd5e1}
.hud{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:18px}
.hud span{color:#facc15;font-weight:bold}
canvas{display:block;margin:14px auto;border:4px solid white;background:#67c7ff;max-width:95vw;box-shadow:0 0 35px #000}
</style>
</head>
<body>
<h1>Shadow Platformer Worlds</h1>
<p>Move: Arrow Keys | Jump: Up / Space | Rewind: Shift | Restart: R | Pause: P</p>
<div class="hud">
  <div>Level: <span id="level">1</span> / 50</div>
  <div>Deaths: <span id="deaths">0</span></div>
  <div>Coins: <span id="coins">0</span></div>
  <div>Shadow: <span id="shadow">Ready</span></div>
</div>
<canvas id="game" width="960" height="480"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const levelText=document.getElementById("level");
const deathsText=document.getElementById("deaths");
const coinsText=document.getElementById("coins");
const shadowText=document.getElementById("shadow");

const keys={};
const pressed={};

let level=0,deaths=0,coins=0,paused=false,started=false;
let checkpoint={x:50,y:350};
let trail=[],rewinding=false,shadowCooldown=0,shake=0;
let message="Press Enter to start",messageTime=999999;

const player={x:50,y:350,w:28,h:38,vx:0,vy:0,speed:5.4,jump:13,grounded:false,facing:1};
const particles=[];
const levels=[];

document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
  if(["arrowup","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if(k==="enter"&&!started){started=true;resetLevel();message="";}
  if(k==="p"&&started){paused=!paused;show(paused?"Paused":"",paused?999999:0);}
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function makeLevels(){
  for(let i=1;i<=50;i++){
    const world=Math.floor((i-1)/10);
    const n=(i-1)%10;
    let bg=["#5fc7ff","#7dd3fc","#fca5a5","#a7f3d0","#c4b5fd"][world];
    let name=["Grass Ruins","Sky Steps","Lava Run","Crystal Caves","Shadow Castle"][world]+" "+(n+1);
    let L={
      name,bg,start:{x:45,y:350},goal:{x:890,y:350,w:42,h:62},
      platforms:[],moving:[],enemies:[],spikes:[],coins:[],pads:[],ghosts:[],gravity:[],
      checkpoint:{x:620,y:300,w:24,h:52},boss:false
    };

    if(world===0){
      L.platforms=[
        P(0,430,170,50),P(205,365-n*3,115,20),P(385,325-(n%3)*18,115,20),
        P(560,280-(n%4)*12,115,20),P(735,235-(n%5)*8,120,20),P(850,430,110,50)
      ];
      L.spikes=[P(175,412,70+n*6,18),P(490,412,75+n*5,18)];
      L.enemies=[E(250,404,210,370,1.3+n*.1)];
      if(n>4)L.moving=[M(315,255,90,16,240,455,1.5)];
      L.pads=n>6?[P(700,405,38,15)]:[];
    }

    if(world===1){
      L.platforms=[
        P(0,430,130,50),P(170,365,85,18),P(300,300,85,18),P(450,245,85,18),
        P(610,190,85,18),P(760,250,90,18),P(850,430,110,50)
      ];
      L.moving=[M(250,390,90,16,180,400,1.8+n*.08),M(600,320,90,16,520,760,1.4+n*.08)];
      L.spikes=[P(130,412,65,18),P(400,412,120,18),P(690,412,100,18)];
      L.enemies=n>2?[E(760,224,735,850,1.4+n*.07)]:[];
      L.pads=[P(535,405,42,15)];
      L.checkpoint={x:610,y:138,w:24,h:52};
    }

    if(world===2){
      L.platforms=[
        P(0,430,145,50),P(210,380,100,18),P(360,335,80,18),P(520,292,105,18),
        P(690,245,95,18),P(840,430,120,50)
      ];
      L.spikes=[P(145,410,760,20)];
      L.moving=[M(180,330,90,16,170,350,1.7+n*.1),M(470,230,90,16,430,650,1.5+n*.1)];
      L.pads=[P(320,405,40,15),P(635,405,40,15)];
      L.enemies=[E(520,266,500,640,1.6+n*.08)];
      L.checkpoint={x:540,y:240,w:24,h:52};
    }

    if(world===3){
      L.platforms=[
        P(0,430,160,50),P(210,350,120,18),P(390,285,120,18),P(580,350,120,18),
        P(760,285,110,18),P(850,430,110,50)
      ];
      L.ghosts=[G(210,350,120,18,120),G(580,350,120,18,150)];
      L.moving=[M(390,390,95,16,350,580,1.6+n*.08)];
      L.gravity=[P(430,40,150,260)];
      L.spikes=[P(165,412,90,18),P(700,412,90,18)];
      L.enemies=n>3?[E(610,324,580,710,1.7)]:[];
      L.checkpoint={x:430,y:233,w:24,h:52};
    }

    if(world===4){
      L.platforms=[
        P(0,430,150,50),P(185,370,90,18),P(330,315,90,18),P(475,260,90,18),
        P(620,315,90,18),P(760,370,90,18),P(850,430,110,50)
      ];
      L.moving=[M(260,230,100,16,210,450,1.8+n*.09),M(590,205,100,16,520,780,1.7+n*.09)];
      L.spikes=[P(150,412,160,18),P(430,412,140,18),P(705,412,120,18)];
      L.enemies=[E(215,344,185,310,1.7+n*.06),E(640,289,620,735,1.8+n*.06)];
      L.pads=[P(565,405,42,15)];
      L.checkpoint={x:475,y:208,w:24,h:52};
    }

    if(i===50){
      L.name="Final Boss: Shadow King";
      L.boss=true;
      L.bg="#8b5cf6";
      L.platforms=[P(0,430,160,50),P(210,360,120,18),P(405,290,150,18),P(650,360,120,18),P(850,430,110,50)];
      L.moving=[M(250,230,100,16,190,430,2.2),M(590,230,100,16,520,780,2.2)];
      L.spikes=[P(160,412,690,18),P(360,272,230,18)];
      L.enemies=[E(440,252,380,590,2.8,70,38),E(240,334,210,340,2.2),E(675,334,650,785,2.2)];
      L.pads=[P(335,405,42,15),P(585,405,42,15)];
      L.checkpoint={x:420,y:238,w:24,h:52};
    }

    L.coins=[C(235,320),C(415,260),C(600,220),C(780,205)];
    if(i%4===0)L.coins.push(C(80,385));
    levels.push(L);
  }
}
function P(x,y,w,h){return{x,y,w,h}}
function M(x,y,w,h,min,max,speed){return{x,y,w,h,min,max,speed,dir:1}}
function E(x,y,min,max,speed,w=30,h=26){return{x,y,w,h,min,max,speed,dir:1}}
function C(x,y){return{x,y,r:9,got:false}}
function G(x,y,w,h,timer){return{x,y,w,h,timer,clock:timer,visible:true}}

makeLevels();

function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function coinHit(c){return player.x<c.x+c.r&&player.x+player.w>c.x-c.r&&player.y<c.y+c.r&&player.y+player.h>c.y-c.r}
function show(t,ms){message=t;messageTime=ms}
function resetPlayer(){player.x=checkpoint.x;player.y=checkpoint.y;player.vx=0;player.vy=0;player.grounded=false;trail=[];rewinding=false}
function resetLevel(){
  const L=levels[level];
  checkpoint={x:L.start.x,y:L.start.y};
  L.coins.forEach(c=>c.got=false);
  L.ghosts.forEach(g=>{g.clock=g.timer;g.visible=true});
  resetPlayer();
  show(L.name,120);
}
function die(){deaths++;shake=12;burst(player.x+14,player.y+18,"#ef4444",18);resetPlayer();show("Try again",70)}
function nextLevel(){
  burst(player.x,player.y,"#facc15",30);
  level++;
  if(level>=50){alert("You beat all 50 levels!");level=0;deaths=0;coins=0;started=false;show("Press Enter to play again",999999);resetLevel();return}
  resetLevel();
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:35+Math.random()*25,color});
}
function updateShadow(){
  if(shadowCooldown>0)shadowCooldown--;
  if(keys.shift&&shadowCooldown<=0&&trail.length>18)rewinding=true;
  if(!keys.shift||trail.length<3){if(rewinding)shadowCooldown=180;rewinding=false}
  if(rewinding){
    const o=trail.pop();player.x=o.x;player.y=o.y;player.vx=o.vx;player.vy=o.vy;player.grounded=o.grounded;
  }else{
    trail.push({x:player.x,y:player.y,vx:player.vx,vy:player.vy,grounded:player.grounded});
    if(trail.length>150)trail.shift();
  }
}
function update(){
  if(started&&!paused){
    const L=levels[level];
    if(pressed.r)resetLevel();

    updateShadow();

    if(!rewinding){
      let grav=.65;
      for(const z of L.gravity)if(collide(player,z))grav=.3;

      player.vx=0;
      if(keys.arrowleft){player.vx=-player.speed;player.facing=-1}
      if(keys.arrowright){player.vx=player.speed;player.facing=1}
      if((pressed.arrowup||pressed[" "])&&player.grounded){player.vy=-player.jump;player.grounded=false}

      player.vy+=grav;
      if(player.vy>16)player.vy=16;

      player.x+=player.vx;
      player.y+=player.vy;
      player.grounded=false;

      for(const m of L.moving){
        m.x+=m.speed*m.dir;
        if(m.x<m.min||m.x+m.w>m.max)m.dir*=-1;
      }

      for(const g of L.ghosts){
        g.clock--;
        if(g.clock<=0){g.visible=!g.visible;g.clock=g.timer}
      }

      const solids=L.platforms.concat(L.moving).concat(L.ghosts.filter(g=>g.visible));
      for(const p of solids){
        if(collide(player,p)&&player.vy>=0){
          player.y=p.y-player.h;player.vy=0;player.grounded=true;
        }
      }

      for(const p of L.pads){
        if(collide(player,p)&&player.vy>=0){
          player.y=p.y-player.h;
          player.vy=-18;
          burst(p.x+p.w/2,p.y,"#38bdf8",10);
        }
      }

      for(const m of L.moving){
        if(player.grounded&&player.y+player.h<=m.y+5&&player.x+player.w>m.x&&player.x<m.x+m.w)player.x+=m.speed*m.dir;
      }

      for(const e of L.enemies){
        e.x+=e.speed*e.dir;
        if(e.x<e.min||e.x+e.w>e.max)e.dir*=-1;
        if(collide(player,e))die();
      }

      for(const s of L.spikes)if(collide(player,s))die();

      for(const c of L.coins){
        if(!c.got&&coinHit(c)){c.got=true;coins++;burst(c.x,c.y,"#facc15",12)}
      }

      if(collide(player,L.checkpoint)){checkpoint={x:L.checkpoint.x,y:L.checkpoint.y-player.h};show("Checkpoint saved",60)}
      if(collide(player,L.goal))nextLevel();
      if(player.y>canvas.height+80)die();

      player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--;
      if(p.life<=0)particles.splice(i,1);
    }

    if(messageTime>0&&messageTime<999999){messageTime--;if(messageTime<=0)message=""}
    shake*=.86;
  }

  levelText.textContent=level+1;
  deathsText.textContent=deaths;
  coinsText.textContent=coins;
  shadowText.textContent=rewinding?"Rewinding":shadowCooldown>0?Math.ceil(shadowCooldown/60)+"s":"Ready";
  for(const k in pressed)pressed[k]=false;
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawSky(L){
  const g=ctx.createLinearGradient(0,0,0,480);
  g.addColorStop(0,L.bg);g.addColorStop(1,"#e0f7ff");
  rect(0,0,960,480,g);
  ctx.fillStyle="rgba(255,255,255,.35)";
  for(let i=0;i<5;i++){
    const x=(i*220+level*14)%960,y=55+(i%3)*34;
    ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.arc(x+30,y,32,0,Math.PI*2);ctx.arc(x+66,y,21,0,Math.PI*2);ctx.fill();
  }
}
function drawSpikes(s){
  const n=Math.max(2,Math.floor(s.w/16)),tw=s.w/n;ctx.fillStyle="#ef4444";
  for(let i=0;i<n;i++){const x=s.x+i*tw;ctx.beginPath();ctx.moveTo(x,s.y+s.h);ctx.lineTo(x+tw/2,s.y);ctx.lineTo(x+tw,s.y+s.h);ctx.closePath();ctx.fill()}
}
function draw(){
  const L=levels[level];
  ctx.save();
  if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawSky(L);

  for(const z of L.gravity)rect(z.x,z.y,z.w,z.h,"rgba(56,189,248,.22)");
  for(const p of L.platforms){rect(p.x,p.y,p.w,p.h,"#166534");rect(p.x,p.y,p.w,6,"#86efac")}
  for(const m of L.moving){rect(m.x,m.y,m.w,m.h,"#92400e");rect(m.x,m.y,m.w,5,"#fbbf24")}
  for(const g of L.ghosts)if(g.visible){rect(g.x,g.y,g.w,g.h,"#334155");rect(g.x,g.y,g.w,5,"#94a3b8")}
  for(const p of L.pads){rect(p.x,p.y,p.w,p.h,"#0369a1");rect(p.x,p.y,p.w,5,"#7dd3fc")}
  for(const s of L.spikes)drawSpikes(s);

  for(const c of L.coins)if(!c.got){
    ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff7ad";ctx.beginPath();ctx.arc(c.x-3,c.y-3,3,0,Math.PI*2);ctx.fill();
  }

  for(const e of L.enemies){
    rect(e.x,e.y,e.w,e.h,L.boss?"#111827":"#7c3aed");
    rect(e.x+7,e.y+7,5,5,"white");rect(e.x+e.w-12,e.y+7,5,5,"white");
  }

  rect(L.checkpoint.x+8,L.checkpoint.y,5,L.checkpoint.h,"#0369a1");
  rect(L.checkpoint.x+13,L.checkpoint.y,28,17,"#38bdf8");
  rect(L.goal.x,L.goal.y,L.goal.w,L.goal.h,"#facc15");
  rect(L.goal.x+9,L.goal.y+10,L.goal.w-18,L.goal.h-20,"#fff7ad");

  for(let i=0;i<trail.length;i+=7){
    const t=trail[i];rect(t.x,t.y,player.w,player.h,"rgba(0,0,0,"+(i/trail.length)*.22+")");
  }
  rect(player.x,player.y,player.w,player.h,rewinding?"#334155":"#020617");
  rect(player.x+(player.facing>0?18:5),player.y+10,5,5,"#38bdf8");

  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/60);rect(p.x,p.y,4,4,p.color);ctx.globalAlpha=1}

  rect(0,450,960,30,"rgba(0,0,0,.5)");
  ctx.fillStyle="white";ctx.font="bold 15px Arial";ctx.fillText(L.name,14,470);

  if(L.boss){ctx.fillStyle="#020617";ctx.font="bold 30px Arial";ctx.fillText("BOSS LEVEL",372,58)}

  if(!started||paused){
    rect(0,0,960,480,"rgba(2,6,23,.6)");
    ctx.fillStyle="white";ctx.font="bold 42px Arial";ctx.fillText("Shadow Platformer Worlds",210,190);
    ctx.font="20px Arial";ctx.fillStyle="#e2e8f0";
    ctx.fillText(message||"Press Enter to start",350,235);
    ctx.fillText("Arrow keys move. Up or Space jumps. Shift rewinds.",260,270);
  }else if(message){
    rect(330,28,300,42,"rgba(2,6,23,.65)");
    ctx.fillStyle="white";ctx.font="bold 18px Arial";ctx.textAlign="center";
    ctx.fillText(message,480,55);ctx.textAlign="left";
  }

  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
