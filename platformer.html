<!DOCTYPE html>
<html>
<head>
  <title>Shadow Platformer</title>
  <style>
    body { margin:0; background:#111; color:white; text-align:center; font-family:Arial; }
    canvas { background:#6ec6ff; display:block; margin:20px auto; border:4px solid white; }
  </style>
</head>
<body>

<h1>Shadow Platformer 🕹️</h1>
<p>Move: A/D or Arrow Keys | Jump: W / Up / Space</p>
<h2>Level: <span id="level">1</span> / 50</h2>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("level");

let keys = {};
let level = 0;

let player = {
  x: 50, y: 300, w: 30, h: 40,
  vx: 0, vy: 0,
  speed: 5, jump: 12,
  grounded: false
};

const levels = [];

for (let i = 1; i <= 50; i++) {
  levels.push({
    platforms: [
      {x:0, y:370, w:120, h:30},
      {x:160, y:330 - (i % 3) * 10, w:90, h:20},
      {x:310, y:290 - (i % 4) * 10, w:80, h:20},
      {x:460, y:250 - (i % 5) * 10, w:80, h:20},
      {x:610, y:210 - (i % 6) * 8, w:75, h:20},
      {x:720, y:170 - (i % 4) * 8, w:70, h:20}
    ],
    spikes: [
      {x:130, y:350, w:80 + i * 2, h:20},
      {x:330, y:350, w:70 + i * 2, h:20},
      {x:540, y:350, w:60 + i * 2, h:20}
    ],
    goal: {x:735, y:120, w:40, h:40}
  });
}

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function currentLevel(){
  return levels[level];
}

function resetPlayer(){
  player.x = 50;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
}

function collide(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function nextLevel(){
  level++;
  if(level >= levels.length){
    alert("You beat all 50 levels!");
    level = 0;
  }
  levelText.innerText = level + 1;
  resetPlayer();
}

function update(){
  const data = currentLevel();

  player.vx = 0;

  if(keys["arrowleft"] || keys["a"]) player.vx = -player.speed;
  if(keys["arrowright"] || keys["d"]) player.vx = player.speed;

  if((keys["arrowup"] || keys["w"] || keys[" "]) && player.grounded){
    player.vy = -player.jump;
    player.grounded = false;
  }

  player.vy += 0.6;
  player.x += player.vx;
  player.y += player.vy;

  player.grounded = false;

  for(let p of data.platforms){
    if(collide(player,p)){
      if(player.vy > 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  for(let s of data.spikes){
    if(collide(player,s)){
      resetPlayer();
    }
  }

  if(player.y > canvas.height){
    resetPlayer();
  }

  if(collide(player,data.goal)){
    nextLevel();
  }
}

function drawSpike(s){
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.moveTo(s.x, s.y + s.h);
  ctx.lineTo(s.x + s.w/2, s.y);
  ctx.lineTo(s.x + s.w, s.y + s.h);
  ctx.closePath();
  ctx.fill();
}

function draw(){
  const data = currentLevel();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "green";
  data.platforms.forEach(p => ctx.fillRect(p.x,p.y,p.w,p.h));

  data.spikes.forEach(drawSpike);

  ctx.fillStyle = "gold";
  ctx.fillRect(data.goal.x,data.goal.y,data.goal.w,data.goal.h);

  ctx.fillStyle = "black";
  ctx.fillRect(player.x,player.y,player.w,player.h);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

levelText.innerText = level + 1;
loop();
</script>

</body>
</html>
