<!DOCTYPE html>
<html>
<head>
  <title>Shadow Platformer</title>
  <style>
    body { margin:0; background:#111; color:white; text-align:center; font-family:Arial; }
    canvas { background:#6ec6ff; display:block; margin:20px auto; border:4px solid white; }
  </style>
</head>
<body>

<h1>Shadow Platformer 🕹️</h1>
<p>Move: A/D or Arrow Keys | Jump: W / Up / Space</p>
<h2>Level: <span id="level">1</span></h2>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("level");

let keys = {};
let level = 0;

let player = {
  x: 50, y: 300, w: 30, h: 40,
  vx: 0, vy: 0,
  speed: 5, jump: 12,
  grounded: false
};

const levels = [
  {
    platforms: [
      {x:0,y:370,w:800,h:30},
      {x:180,y:300,w:120,h:20},
      {x:380,y:240,w:120,h:20},
      {x:600,y:180,w:120,h:20}
    ],
    spikes: [],
    goal: {x:720,y:130,w:40,h:40}
  },
  {
    platforms: [
      {x:0,y:370,w:800,h:30},
      {x:120,y:310,w:100,h:20},
      {x:300,y:260,w:90,h:20},
      {x:470,y:210,w:90,h:20},
      {x:650,y:160,w:80,h:20}
    ],
    spikes: [
      {x:250,y:350,w:40,h:20},
      {x:520,y:350,w:40,h:20}
    ],
    goal: {x:700,y:110,w:40,h:40}
  },
  {
    platforms: [
      {x:0,y:370,w:160,h:30},
      {x:240,y:330,w:90,h:20},
      {x:410,y:280,w:80,h:20},
      {x:580,y:230,w:70,h:20},
      {x:700,y:180,w:80,h:20}
    ],
    spikes: [
      {x:170,y:350,w:60,h:20},
      {x:340,y:350,w:60,h:20},
      {x:500,y:350,w:60,h:20}
    ],
    goal: {x:720,y:130,w:40,h:40}
  },
  {
    platforms: [
      {x:0,y:370,w:800,h:30},
      {x:100,y:320,w:70,h:20},
      {x:230,y:280,w:70,h:20},
      {x:360,y:240,w:70,h:20},
      {x:490,y:200,w:70,h:20},
      {x:620,y:160,w:70,h:20}
    ],
    spikes: [
      {x:180,y:350,w:70,h:20},
      {x:330,y:350,w:70,h:20},
      {x:480,y:350,w:70,h:20},
      {x:630,y:350,w:70,h:20}
    ],
    goal: {x:640,y:110,w:40,h:40}
  },
  {
    platforms: [
      {x:0,y:370,w:120,h:30},
      {x:180,y:330,w:70,h:20},
      {x:320,y:290,w:70,h:20},
      {x:460,y:250,w:70,h:20},
      {x:600,y:210,w:70,h:20},
      {x:720,y:170,w:70,h:20}
    ],
    spikes: [
      {x:130,y:350,w:650,h:20}
    ],
    goal: {x:735,y:120,w:40,h:40}
  }
];

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function currentLevel(){
  return levels[level];
}

function resetPlayer(){
  player.x = 50;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
}

function collide(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function nextLevel(){
  level++;
  if(level >= levels.length){
    alert("You beat all levels!");
    level = 0;
  }
  levelText.innerText = level + 1;
  resetPlayer();
}

function update(){
  const data = currentLevel();

  player.vx = 0;

  if(keys["arrowleft"] || keys["a"]) player.vx = -player.speed;
  if(keys["arrowright"] || keys["d"]) player.vx = player.speed;

  if((keys["arrowup"] || keys["w"] || keys[" "]) && player.grounded){
    player.vy = -player.jump;
    player.grounded = false;
  }

  player.vy += 0.6;
  player.x += player.vx;
  player.y += player.vy;

  player.grounded = false;

  for(let p of data.platforms){
    if(collide(player,p)){
      if(player.vy > 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  for(let s of data.spikes){
    if(collide(player,s)){
      resetPlayer();
    }
  }

  if(player.y > canvas.height){
    resetPlayer();
  }

  if(collide(player,data.goal)){
    nextLevel();
  }
}

function drawSpike(s){
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.moveTo(s.x, s.y + s.h);
  ctx.lineTo(s.x + s.w/2, s.y);
  ctx.lineTo(s.x + s.w, s.y + s.h);
  ctx.closePath();
  ctx.fill();
}

function draw(){
  const data = currentLevel();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "green";
  data.platforms.forEach(p => ctx.fillRect(p.x,p.y,p.w,p.h));

  data.spikes.forEach(drawSpike);

  ctx.fillStyle = "gold";
  ctx.fillRect(data.goal.x,data.goal.y,data.goal.w,data.goal.h);

  ctx.fillStyle = "black";
  ctx.fillRect(player.x,player.y,player.w,player.h);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

levelText.innerText = level + 1;
loop();
</script>

</body>
</html>
