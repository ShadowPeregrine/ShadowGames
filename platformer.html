<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Platformer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 18px 0 5px;
      font-size: 42px;
    }

    p {
      margin: 8px;
      color: #cbd5e1;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 18px;
      margin: 12px 0;
    }

    .hud span {
      color: #ffd166;
      font-weight: bold;
    }

    canvas {
      display: block;
      margin: 18px auto;
      border: 4px solid white;
      background: #6ec6ff;
      max-width: 95vw;
      box-shadow: 0 0 35px rgba(0,0,0,.5);
    }

    .tip {
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <h1>Shadow Platformer</h1>
  <p>Move: A/D or Arrow Keys | Jump: W / Up / Space | Shadow Rewind: Shift | Restart: R</p>

  <div class="hud">
    <div>Level: <span id="level">1</span> / 50</div>
    <div>Deaths: <span id="deaths">0</span></div>
    <div>Shadow: <span id="shadow">Ready</span></div>
  </div>

  <canvas id="game" width="900" height="450"></canvas>
  <p class="tip">Reach the golden portal. Blue flags are checkpoints. Red spikes and purple enemies reset you.</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const levelText = document.getElementById("level");
    const deathsText = document.getElementById("deaths");
    const shadowText = document.getElementById("shadow");

    const keys = {};
    const pressed = {};

    let level = 0;
    let deaths = 0;
    let checkpoint = { x: 50, y: 340 };
    let trail = [];
    let rewinding = false;
    let shadowCooldown = 0;
    let screenShake = 0;

    const player = {
      x: 50,
      y: 340,
      w: 28,
      h: 38,
      vx: 0,
      vy: 0,
      speed: 5,
      jump: 13,
      grounded: false
    };

    const levels = [];

    for (let i = 1; i <= 50; i++) {
      const hard = Math.floor(i / 10);

      levels.push({
        platforms: [
          { x: 0, y: 410, w: 155, h: 40 },
          { x: 190, y: 350 - (i % 3) * 12, w: 105, h: 20 },
          { x: 370, y: 305 - (i % 4) * 10, w: 105, h: 20 },
          { x: 550, y: 260 - (i % 5) * 8, w: 105, h: 20 },
          { x: 720, y: 220 - (i % 6) * 6, w: 115, h: 20 },
          { x: 820, y: 410, w: 80, h: 40 }
        ],
        moving: [
          {
            x: 285,
            y: 250,
            w: 90,
            h: 16,
            min: 230,
            max: 430,
            dir: 1,
            speed: 1.2 + i * 0.035
          }
        ],
        enemies: [
          {
            x: 305,
            y: 384,
            w: 30,
            h: 26,
            min: 210,
            max: 570,
            dir: 1,
            speed: 1.2 + i * 0.03
          }
        ],
        spikes: [
          { x: 155, y: 392, w: 70 + hard * 8, h: 18 },
          { x: 470, y: 392, w: 75 + hard * 10, h: 18 }
        ],
        checkpoint: { x: 615, y: 218 - (i % 4) * 8, w: 22, h: 42 },
        goal: { x: 840, y: 355, w: 38, h: 55 },
        boss: i === 50
      });

      if (i > 12) {
        levels[i - 1].enemies.push({
          x: 650,
          y: 384,
          w: 30,
          h: 26,
          min: 600,
          max: 815,
          dir: -1,
          speed: 1 + i * 0.025
        });
      }

      if (i > 25) {
        levels[i - 1].moving.push({
          x: 610,
          y: 170,
          w: 80,
          h: 16,
          min: 545,
          max: 720,
          dir: -1,
          speed: 1.1 + i * 0.02
        });
      }
    }

    document.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (!keys[key]) pressed[key] = true;
      keys[key] = true;

      if ([" ", "arrowup", "arrowleft", "arrowright"].includes(key)) {
        e.preventDefault();
      }
    });

    document.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    function collide(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function resetPlayer() {
      player.x = checkpoint.x;
      player.y = checkpoint.y;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      trail = [];
      rewinding = false;
    }

    function restartLevel() {
      checkpoint = { x: 50, y: 340 };
      resetPlayer();
    }

    function die() {
      deaths++;
      deathsText.textContent = deaths;
      screenShake = 10;
      resetPlayer();
    }

    function nextLevel() {
      level++;

      if (level >= 50) {
        alert("You beat all 50 levels!");
        level = 0;
        deaths = 0;
        deathsText.textContent = deaths;
      }

      checkpoint = { x: 50, y: 340 };
      resetPlayer();
      levelText.textContent = level + 1;
    }

    function updateShadow() {
      if (shadowCooldown > 0) shadowCooldown--;

      if (keys["shift"] && shadowCooldown <= 0 && trail.length > 15) {
        rewinding = true;
      }

      if (!keys["shift"] || trail.length <= 2) {
        if (rewinding) shadowCooldown = 180;
        rewinding = false;
      }

      if (rewinding) {
        const old = trail.pop();
        player.x = old.x;
        player.y = old.y;
        player.vx = old.vx;
        player.vy = old.vy;
      } else {
        trail.push({
          x: player.x,
          y: player.y,
          vx: player.vx,
          vy: player.vy
        });

        if (trail.length > 140) trail.shift();
      }

      shadowText.textContent = rewinding
        ? "Rewinding"
        : shadowCooldown > 0
          ? Math.ceil(shadowCooldown / 60) + "s"
          : "Ready";
    }

    function update() {
      const data = levels[level];

      if (pressed["r"]) restartLevel();

      updateShadow();

      if (!rewinding) {
        player.vx = 0;

        if (keys["a"] || keys["arrowleft"]) player.vx = -player.speed;
        if (keys["d"] || keys["arrowright"]) player.vx = player.speed;

        if ((pressed["w"] || pressed["arrowup"] || pressed[" "]) && player.grounded) {
          player.vy = -player.jump;
          player.grounded = false;
        }

        player.vy += 0.65;
        if (player.vy > 16) player.vy = 16;

        player.x += player.vx;
        player.y += player.vy;
        player.grounded = false;

        const allPlatforms = data.platforms.concat(data.moving);

        for (const p of allPlatforms) {
          if (collide(player, p) && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
          }
        }

        for (const p of data.moving) {
          p.x += p.speed * p.dir;

          if (p.x < p.min || p.x + p.w > p.max) {
            p.dir *= -1;
          }

          if (
            player.grounded &&
            player.y + player.h <= p.y + 5 &&
            player.x + player.w > p.x &&
            player.x < p.x + p.w
          ) {
            player.x += p.speed * p.dir;
          }
        }

        for (const e of data.enemies) {
          e.x += e.speed * e.dir;

          if (e.x < e.min || e.x + e.w > e.max) {
            e.dir *= -1;
          }

          if (collide(player, e)) die();
        }

        for (const s of data.spikes) {
          if (collide(player, s)) die();
        }

        if (collide(player, data.checkpoint)) {
          checkpoint = {
            x: data.checkpoint.x,
            y: data.checkpoint.y - player.h
          };
        }

        if (collide(player, data.goal)) nextLevel();

        if (player.y > canvas.height + 80) die();

        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
      }

      screenShake *= 0.85;

      for (const key in pressed) {
        pressed[key] = false;
      }
    }

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawSpikes(s) {
      const count = Math.max(2, Math.floor(s.w / 16));
      const tooth = s.w / count;

      ctx.fillStyle = "#ef4444";

      for (let i = 0; i < count; i++) {
        const x = s.x + i * tooth;

        ctx.beginPath();
        ctx.moveTo(x, s.y + s.h);
        ctx.lineTo(x + tooth / 2, s.y);
        ctx.lineTo(x + tooth, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawEnemy(e) {
      rect(e.x, e.y, e.w, e.h, level === 49 ? "#111827" : "#7c3aed");

      ctx.fillStyle = "white";
      ctx.fillRect(e.x + 7, e.y + 7, 5, 5);
      ctx.fillRect(e.x + e.w - 12, e.y + 7, 5, 5);
    }

    function drawPlayer() {
      for (let i = 0; i < trail.length; i += 7) {
        const t = trail[i];
        ctx.fillStyle = "rgba(0,0,0," + (i / trail.length) * 0.22 + ")";
        ctx.fillRect(t.x, t.y, player.w, player.h);
      }

      rect(player.x, player.y, player.w, player.h, rewinding ? "#334155" : "#020617");

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x + 18, player.y + 10, 5, 5);
    }

    function draw() {
      const data = levels[level];

      ctx.save();

      if (screenShake > 1) {
        ctx.translate(
          (Math.random() - 0.5) * screenShake,
          (Math.random() - 0.5) * screenShake
        );
      }

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#38bdf8");
      sky.addColorStop(1, "#dff6ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.beginPath();
      ctx.arc(90, 70, 25, 0, Math.PI * 2);
      ctx.arc(125, 70, 35, 0, Math.PI * 2);
      ctx.arc(165, 70, 24, 0, Math.PI * 2);
      ctx.fill();

      for (const p of data.platforms) {
        rect(p.x, p.y, p.w, p.h, "#166534");
        rect(p.x, p.y, p.w, 6, "#86efac");
      }

      for (const p of data.moving) {
        rect(p.x, p.y, p.w, p.h, "#92400e");
        rect(p.x, p.y, p.w, 5, "#fbbf24");
      }

      for (const s of data.spikes) drawSpikes(s);
      for (const e of data.enemies) drawEnemy(e);

      rect(data.checkpoint.x + 8, data.checkpoint.y, 5, data.checkpoint.h, "#0284c7");
      rect(data.checkpoint.x + 13, data.checkpoint.y, 24, 16, "#38bdf8");

      rect(data.goal.x, data.goal.y, data.goal.w, data.goal.h, "#facc15");
      rect(data.goal.x + 10, data.goal.y + 10, data.goal.w - 20, data.goal.h - 20, "#fde68a");

      drawPlayer();

      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0, canvas.height - 28, canvas.width, 28);

      ctx.fillStyle = "white";
      ctx.font = "bold 15px Arial";
      ctx.fillText(level === 49 ? "FINAL LEVEL: THE SHADOW KING" : "Trial " + (level + 1), 14, canvas.height - 10);

      if (level === 49) {
        ctx.fillStyle = "black";
        ctx.font = "bold 30px Arial";
        ctx.fillText("BOSS LEVEL", 355, 55);
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
