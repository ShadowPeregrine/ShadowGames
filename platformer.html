<!DOCTYPE html>
<html>
<head>
  <title>Shadow Platformer</title>
  <style>
    body { margin:0; background:#0b1220; color:white; text-align:center; font-family:Arial; }
    canvas { background:linear-gradient(#6ec6ff,#cfefff); display:block; margin:20px auto; border:4px solid white; }
  </style>
</head>
<body>

<h1>Shadow Platformer 🎮</h1>
<p>Move: A/D | Jump: Space | Restart: R</p>
<h2>Level: <span id="level">1</span> / 50 | ❤️ <span id="hp">3</span></h2>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let level = 0;
let hp = 3;

let player = {x:50,y:300,w:30,h:40,vx:0,vy:0,speed:5,jump:12,ground:false};
let checkpoint = {x:50,y:300};

let keys={};
document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function collide(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function reset(){
  player.x=checkpoint.x;
  player.y=checkpoint.y;
  player.vy=0;
  hp--;
  if(hp<=0){
    alert("Game Over");
    level=0;
    hp=3;
  }
}

function nextLevel(){
  level++;
  if(level>=50){
    alert("👑 YOU WIN!");
    level=0;
  }
  checkpoint={x:50,y:300};
  hp=3;
}

function genLevel(i){
  return {
    platforms:[
      {x:0,y:370,w:800,h:30},
      {x:150,y:300-(i%3)*10,w:100,h:20},
      {x:320,y:250-(i%4)*10,w:100,h:20},
      {x:500,y:200-(i%5)*10,w:100,h:20}
    ],
    moving:[
      {x:250,y:220,w:80,h:15,dir:1}
    ],
    enemies:[
      {x:300,y:340,w:30,h:20,dir:1}
    ],
    coins:[
      {x:200,y:260,w:10,h:10},
      {x:520,y:180,w:10,h:10}
    ],
    checkpoint:{x:600,y:330,w:20,h:40},
    goal:{x:740,y:120,w:40,h:40},
    boss: i===49
  };
}

const levels = Array.from({length:50},(_,i)=>genLevel(i));

function update(){
  let d=levels[level];

  player.vx=0;
  if(keys["a"])player.vx=-player.speed;
  if(keys["d"])player.vx=player.speed;

  if(keys[" "]&&player.ground){
    player.vy=-player.jump;
    player.ground=false;
  }

  player.vy+=0.6;
  player.x+=player.vx;
  player.y+=player.vy;

  player.ground=false;

  d.platforms.forEach(p=>{
    if(collide(player,p)&&player.vy>0){
      player.y=p.y-player.h;
      player.vy=0;
      player.ground=true;
    }
  });

  d.moving.forEach(p=>{
    p.x+=p.dir*2;
    if(p.x<200||p.x>500)p.dir*=-1;
    if(collide(player,p)){
      player.y=p.y-player.h;
      player.vy=0;
      player.ground=true;
    }
  });

  d.enemies.forEach(e=>{
    e.x+=e.dir*2;
    if(e.x<200||e.x>600)e.dir*=-1;
    if(collide(player,e))reset();
  });

  d.coins=d.coins.filter(c=>{
    if(collide(player,c)){
      hp++;
      return false;
    }
    return true;
  });

  if(collide(player,d.checkpoint)){
    checkpoint.x=d.checkpoint.x;
    checkpoint.y=d.checkpoint.y;
  }

  if(collide(player,d.goal)){
    nextLevel();
  }

  if(player.y>400)reset();

  document.getElementById("level").innerText=level+1;
  document.getElementById("hp").innerText=hp;
}

function draw(){
  let d=levels[level];
  ctx.clearRect(0,0,800,400);

  ctx.fillStyle="green";
  d.platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));

  ctx.fillStyle="brown";
  d.moving.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));

  ctx.fillStyle="purple";
  d.enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

  ctx.fillStyle="yellow";
  d.coins.forEach(c=>ctx.fillRect(c.x,c.y,c.w,c.h));

  ctx.fillStyle="blue";
  ctx.fillRect(d.checkpoint.x,d.checkpoint.y,d.checkpoint.w,d.checkpoint.h);

  ctx.fillStyle="gold";
  ctx.fillRect(d.goal.x,d.goal.y,d.goal.w,d.goal.h);

  ctx.fillStyle="black";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  if(d.boss){
    ctx.fillStyle="red";
    ctx.font="30px Arial";
    ctx.fillText("BOSS",350,100);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
