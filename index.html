<!DOCTYPE html>
<html>
<head>
  <title>Shadow Games</title>
</head>

<body style="margin:0;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');background-size:cover;background-position:center;font-family:Arial;color:white;text-align:center;">

<div style="background:rgba(0,0,0,0.75);padding:30px;min-height:100vh;">

<h1>Shadow Games 🎮</h1>

<h2>Score: <span id="score">0</span></h2>
<p>Time Played: <span id="timer">0m 0s</span></p>
<p>Power: <span id="perClick">1</span> per click</p>
<p>Auto: <span id="auto">0</span>/sec</p>
<p>Multiplier: x<span id="multi">1</span></p>
<p>Prestige Stars: ⭐ <span id="stars">0</span></p>

<button style="font-size:28px;padding:25px;border-radius:15px;" onclick="clickGame()">CLICK</button>

<h2>Shop</h2>
<button onclick="buyClick()">+ Click Power | Cost: <span id="clickCost">10</span></button><br><br>
<button onclick="buyAuto()">+ Auto Power | Cost: <span id="autoCost">50</span></button><br><br>
<button onclick="buyMulti()">x2 Multiplier | Cost: <span id="multiCost">200</span></button><br><br>
<button onclick="buyMega()">💥 Mega Boost | Cost: <span id="megaCost">1K</span></button><br><br>

<h2>Big Upgrades</h2>
<button onclick="buySuperClick()">🔥 Super Click | Cost: <span id="superClickCost">10K</span></button><br><br>
<button onclick="buyFactory()">🏭 Factory | Cost: <span id="factoryCost">25K</span></button><br><br>
<button onclick="buyDarkMulti()">🌌 Dark Multiplier x10 | Cost: <span id="darkMultiCost">100K</span></button><br><br>
<button onclick="buyDiamond()">💎 Diamond Boost | Cost: <span id="diamondCost">500K</span></button><br><br>
<button onclick="buyKing()">👑 King Upgrade | Cost: <span id="kingCost">2M</span></button><br><br>

<h2>Special</h2>
<button onclick="goldenBonus()">🍀 Golden Bonus | Cost: <span id="goldCost">1K</span></button><br><br>
<button onclick="buyGoldenClicker()">✨ Golden Clicker | Cost: <span id="goldenClickerCost">20K</span></button><br><br>
<p>Golden Clickers: <span id="goldenClickers">0</span></p>

<button onclick="prestige()">⭐ Prestige Reset</button><br><br>
<button onclick="hardReset()">🗑 Reset Save</button>

<h3 id="message"></h3>

<h2>🏆 Leaderboard Top 10</h2>
<input id="playerName" placeholder="Your name">
<button onclick="submitScore()">Submit Score</button>
<ol id="leaderboard"></ol>

<script>
let score = 0, perClick = 1, auto = 0, multi = 1, stars = 0;
let clickCost = 10, autoCost = 50, multiCost = 200, megaCost = 1000;
let goldenCost = 1000;

let superClickCost = 10000;
let factoryCost = 25000;
let darkMultiCost = 100000;
let diamondCost = 500000;
let kingCost = 2000000;

let goldenClicker = 0;
let goldenClickerCost = 20000;

let startTime = Date.now();
let lastSave = Date.now();
let secretAuto = false;

function starBoost(){ return 1 + stars * 0.25; }

function getTimePlayed(){
  let s=Math.floor((Date.now()-startTime)/1000);
  return Math.floor(s/60)+"m "+(s%60)+"s";
}

function format(n){
  if(n>=1e9)return (n/1e9).toFixed(2)+"B";
  if(n>=1e6)return (n/1e6).toFixed(2)+"M";
  if(n>=1e3)return (n/1e3).toFixed(2)+"K";
  return Math.floor(n);
}

function clickGame(){
  score += perClick * multi * starBoost();
  update();
}

function buyClick(){ if(score>=clickCost){score-=clickCost;perClick++;clickCost*=1.45;update();} }
function buyAuto(){ if(score>=autoCost){score-=autoCost;auto++;autoCost*=1.6;update();} }
function buyMulti(){ if(score>=multiCost){score-=multiCost;multi*=2;multiCost*=3;update();} }
function buyMega(){ if(score>=megaCost){score-=megaCost;perClick+=25;auto+=10;megaCost*=5;update();} }

function buySuperClick(){ if(score>=superClickCost){score-=superClickCost;perClick+=100;superClickCost*=2.5;update();} }
function buyFactory(){ if(score>=factoryCost){score-=factoryCost;auto+=50;factoryCost*=2.8;update();} }
function buyDarkMulti(){ if(score>=darkMultiCost){score-=darkMultiCost;multi*=10;darkMultiCost*=5;update();} }
function buyDiamond(){ if(score>=diamondCost){score-=diamondCost;perClick+=500;auto+=100;diamondCost*=4;update();} }
function buyKing(){ if(score>=kingCost){score-=kingCost;perClick*=2;auto*=2;multi*=2;kingCost*=10;update();} }

function goldenBonus(){
  if(score>=goldenCost){
    score-=goldenCost;
    let bonus=Math.max(100,score*0.6);
    score+=bonus;
    goldenCost*=2.5;
    update();
  }
}

function buyGoldenClicker(){
  if(score>=goldenClickerCost){
    score-=goldenClickerCost;
    goldenClicker++;
    goldenClickerCost*=3;
    update();
  }
}

/* ✅ NEW: passive Golden Clicker income */
setInterval(function() {
  if (goldenClicker > 0) {
    score += goldenClicker * 50;
    update();
  }
}, 1000);

setInterval(()=>{ score += auto * multi * starBoost(); update(); },1000);

/* 🤫 hidden autoclick (no UI mention) */
document.addEventListener("keydown", e=>{
  if(e.key.toLowerCase()==="m"){ secretAuto=!secretAuto; }
});
setInterval(()=>{ if(secretAuto){ score+=perClick*multi*starBoost()*10; update(); }},50);

function prestige(){
  if(score>=1000000){
    stars+=Math.floor(Math.sqrt(score/1000000));
    score=0; perClick=1; auto=0; multi=1;
    clickCost=10; autoCost=50; multiCost=200; megaCost=1000; goldenCost=1000;
    superClickCost=10000; factoryCost=25000; darkMultiCost=100000; diamondCost=500000; kingCost=2000000;
    goldenClicker=0; goldenClickerCost=20000;
    startTime=Date.now();
    update();
  }
}

function hardReset(){ localStorage.clear(); location.reload(); }

function submitScore(){
  let name=document.getElementById("playerName").value||"Player";
  let board=JSON.parse(localStorage.getItem("leaderboard"))||[];
  board.push({name,score:Math.floor(score),time:getTimePlayed()});
  board.sort((a,b)=>b.score-a.score);
  board=board.slice(0,10);
  localStorage.setItem("leaderboard",JSON.stringify(board));
  showLeaderboard();
}

function showLeaderboard(){
  let board=JSON.parse(localStorage.getItem("leaderboard"))||[];
  let list=document.getElementById("leaderboard");
  list.innerHTML="";
  board.forEach(e=>{
    let li=document.createElement("li");
    li.innerText=e.name+" — "+format(e.score)+" — "+e.time;
    list.appendChild(li);
  });
}

setInterval(()=>{ document.getElementById("timer").innerText=getTimePlayed(); },1000);

function saveGame(){
  lastSave=Date.now();
  localStorage.setItem("shadowGame",JSON.stringify({
    score,perClick,auto,multi,stars,
    clickCost,autoCost,multiCost,megaCost,goldenCost,
    superClickCost,factoryCost,darkMultiCost,diamondCost,kingCost,
    goldenClicker,goldenClickerCost,startTime,lastSave
  }));
}
setInterval(saveGame,2000);

function loadGame(){
  let s=JSON.parse(localStorage.getItem("shadowGame"));
  if(s){
    Object.assign(window,s);
    let offline=Math.floor((Date.now()-s.lastSave)/1000);
    score+=offline*auto*multi*starBoost();
  }
  update();
  showLeaderboard();
}

function update(){
  document.getElementById("score").innerText=format(score);
  document.getElementById("perClick").innerText=perClick;
  document.getElementById("auto").innerText=auto;
  document.getElementById("multi").innerText=multi;
  document.getElementById("stars").innerText=stars;
  document.getElementById("clickCost").innerText=format(clickCost);
  document.getElementById("autoCost").innerText=format(autoCost);
  document.getElementById("multiCost").innerText=format(multiCost);
  document.getElementById("megaCost").innerText=format(megaCost);
  document.getElementById("goldCost").innerText=format(goldenCost);
  document.getElementById("goldenClickerCost").innerText=format(goldenClickerCost);
  document.getElementById("goldenClickers").innerText=goldenClicker;
}
goldenClicker = 0;
update();
saveGame();
loadGame();
</script>

</div>
</body>
</html>
