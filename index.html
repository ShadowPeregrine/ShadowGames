<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Quest Ultimate</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef6ff;
font-family:Arial,sans-serif;
text-align:center;
color:#0f172a;
}

h1{
font-size:48px;
margin:16px 0 8px;
color:#2563eb;
}

p{
color:#475569;
margin:6px;
}

.hud{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin:12px;
}

.hud div{
background:white;
padding:10px 14px;
border-radius:12px;
border:2px solid #bfdbfe;
font-weight:bold;
}

.game{
width:min(950px,95vw);
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
border:4px solid #93c5fd;
box-shadow:0 10px 30px rgba(37,99,235,.2);
}

.word{
font-size:54px;
font-weight:bold;
margin:24px 0;
color:#16a34a;
word-break:break-word;
}

input{
font-size:32px;
padding:14px;
width:min(550px,90%);
text-align:center;
border-radius:14px;
border:4px solid #93c5fd;
outline:none;
}

input:focus{
border-color:#2563eb;
}

button{
margin:8px;
padding:12px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.gradeButtons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:14px;
}

.feedback{
font-size:24px;
font-weight:bold;
margin:12px;
min-height:34px;
}

.progress{
width:min(700px,90%);
height:24px;
margin:16px auto;
background:#dbeafe;
border-radius:999px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#22c55e;
transition:.2s;
}

</style>
</head>

<body>

<h1>Keyboard Quest Ultimate</h1>
<p>All Elementary School Words • Grade Levels • No Repeat Spam</p>

<div class="hud">
<div>Grade: <span id="gradeText">K</span></div>
<div>Level: <span id="level">1</span></div>
<div>Score: <span id="score">0</span></div>
<div>Streak: <span id="streak">0</span></div>
<div>Time: <span id="time">60</span></div>
<div>Words: <span id="wordsDone">0</span></div>
</div>

<div class="game">

<div class="gradeButtons">
<button onclick="setGrade('k')">K</button>
<button onclick="setGrade('1')">1st</button>
<button onclick="setGrade('2')">2nd</button>
<button onclick="setGrade('3')">3rd</button>
<button onclick="setGrade('4')">4th</button>
<button onclick="setGrade('5')">5th</button>
<button onclick="setGrade('6')">6th</button>
</div>

<div class="word" id="word">cat</div>

<input
id="answer"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
placeholder="type here"
>

<div class="feedback" id="feedback"></div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<button onclick="startGame()">Start / Restart</button>

</div>

<script>

const wordBox=document.getElementById("word");
const answer=document.getElementById("answer");
const feedback=document.getElementById("feedback");

const levelText=document.getElementById("level");
const scoreText=document.getElementById("score");
const streakText=document.getElementById("streak");
const timeText=document.getElementById("time");
const wordsDoneText=document.getElementById("wordsDone");
const gradeText=document.getElementById("gradeText");

const bar=document.getElementById("bar");

const gradeWords={

k:[
"cat","dog","sun","run","big","red","blue","hat","fish","jump",
"tree","book","cake","milk","frog","star","ball","play","home","bird",
"baby","apple","bed","car","duck","egg","feet","green","hand","ice",
"jam","kite","lion","moon","nest","orange","pig","queen","rain","sock",
"toy","umbrella","van","water","box","yellow","zebra","happy","sad","yes"
],

1:[
"school","rabbit","yellow","purple","family","rocket","flower","planet","friend","winter",
"summer","button","garden","turtle","basket","monster","kitchen","teacher","spelling","music",
"animal","before","because","between","children","different","favorite","morning","picture","people",
"sentence","station","under","window","without","wonder","blanket","camping","dolphin","forest",
"guitar","helmet","island","jungle","kitten","lemon","magnet","napkin","ocean","pillow"
],

2:[
"adventure","beautiful","birthday","chocolate","dangerous","elephant","exercise","favorite","firefighter","grandmother",
"hamburger","important","invisible","knowledge","language","mountain","neighborhood","opposite","pineapple","question",
"remember","sandwich","tomorrow","umbrella","vacation","whisper","yesterday","backpack","cafeteria","delicious",
"electric","fantastic","gigantic","hospital","internet","kangaroo","laughter","mystery","notebook","outside",
"playground","rainstorm","scissors","telephone","understand","vegetable","waterfall","xylophone","yourself","zookeeper"
],

3:[
"accident","alphabet","audience","calculator","celebration","community","construction","conversation","dictionary","education",
"environment","experiment","friendship","government","imagination","information","invention","mathematics","newspaper","opportunity",
"organization","paragraph","population","president","pronunciation","relationship","restaurant","scientist","temperature","transportation",
"understanding","vacation","volunteer","wonderful","adjective","brilliant","courageous","discovery","excellent","favorite",
"generation","headquarters","impossible","journalist","kindergarten","lightning","microscope","necessary","orchestra","passenger"
],

4:[
"architecture","characteristic","communication","congratulations","counterproductive","determination","disappointment","electromagnetic","encyclopedia","extraordinary",
"identification","intercontinental","interpretation","investigation","miscalculation","miscommunication","multiplication","organization","perpendicular","philosopher",
"photosynthesis","qualification","questionnaire","recommendation","representation","responsibility","substitution","transformation","transportation","unbelievable",
"underestimate","unpredictable","bioluminescence","circumference","configuration","demonstration","environmentalist","grandfatherly","hyperactivity","independent",
"interchangeable","meteorologist","microbiology","microprocessor","misbehavior","misinterpretation","neighborhood","parallelogram","pharmaceutical","rehabilitation"
],

5:[
"counterattack","counterproductive","encyclopedic","experimentation","interrogation","mispronounced","organizational","pronunciation","rehabilitation","revolutionary",
"transcontinental","trigonometry","vocabulary","civilization","classification","complicated","configuration","contradiction","demonstration","disagreement",
"electromagnetic","encyclopedia","extraordinary","headquarters","identification","investigator","mathematical","microbiology","microscopic","miscommunication",
"multiplication","opportunity","pharmaceutical","photosynthesis","possibility","questionnaire","relationship","representation","responsibility","substitution",
"temperature","transportation","understanding","university","adventure","architecture","celebration","construction","environment","investigation"
]

  6:[
"abbreviation","accomplishment","acknowledgment","administration","archaeologist","biodegradable","catastrophe","circumference","collaboration","communication",
"comprehension","conservation","constitutional","controversial","coordination","declaration","demonstration","determination","discrimination","electromagnetic",
"encyclopedia","entrepreneur","environmentalist","extraordinary","fascinating","fundamental","geographical","governmental","heterogeneous","hypothesis",
"identification","illustration","imagination","implementation","inconvenience","independence","individuality","industrialization","information","interpretation",
"investigation","journalism","knowledgeable","mathematical","microscope","misinterpretation","multiplication","neighborhood","observatory","opportunity",
"organization","parallelogram","participation","perpendicular","pharmaceutical","photosynthesis","planetarium","possibility","pronunciation","questionnaire",
"recommendation","rehabilitation","representation","responsibility","simultaneous","substitution","temperature","transcontinental","transportation","trigonometry",
"underestimate","understanding","unpredictable","vocabulary","volunteerism","withdrawal","xylophonist","youthfulness","zoologist","architecture",
"bioluminescence","classification","configuration","counterproductive","experimentation","headquarters","interchangeable","microbiology","microprocessor","rehabilitation",
"revolutionary","transformation","unbelievable","visualization","counterattack","demonstration","encyclopedic","grandfatherly","hyperactivity","microscopic"
]

};

let grade="k";
let currentWord="cat";

let score=0;
let streak=0;
let level=1;
let wordsDone=0;
let time=60;

let playing=false;
let timer=null;

let shuffled=[];

function setGrade(g){

grade=g;

gradeText.textContent=
g==="k"?"K":
g==="1"?"1st":
g==="2"?"2nd":
g==="3"?"3rd":
g==="4"?"4th":
g==="5"?"5th":  
g==="6"?"6th":  
"K";

shuffled=[];

nextWord();

answer.focus();
}

function wordList(){
return gradeWords[grade];
}

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];
}
}

function pickWord(){

if(shuffled.length===0){

shuffled=[...wordList()];

shuffle(shuffled);
}

return shuffled.pop();
}

function nextWord(){

currentWord=pickWord();

wordBox.textContent=currentWord;

answer.value="";
}

function startGame(){

score=0;
streak=0;
level=1;
wordsDone=0;
time=60;

playing=true;

shuffled=[];

feedback.textContent="";

updateHud();

nextWord();

answer.focus();

clearInterval(timer);

timer=setInterval(function(){

if(!playing)return;

time--;

updateHud();

if(time<=0){

endGame();
}

},1000);
}

function endGame(){

playing=false;

clearInterval(timer);

time=0;

updateHud();

feedback.textContent="Time is up! Final score: "+score;

feedback.style.color="#2563eb";
}

function correct(){

score+=10+streak;

streak++;

wordsDone++;

if(wordsDone%10===0){

level++;

feedback.textContent="Level up!";

}else{

feedback.textContent="Great job!";
}

feedback.style.color="#16a34a";

burstProgress();

nextWord();

updateHud();
}

function wrong(){

streak=0;

time=Math.max(0,time-3);

feedback.textContent="Wrong! -3 seconds";

feedback.style.color="#dc2626";

updateHud();

if(time<=0){

endGame();

}else{

answer.select();
}
}

function burstProgress(){

const percent=Math.min(100,(wordsDone%10)*10);

bar.style.width=percent+"%";

if(percent===0)bar.style.width="100%";

setTimeout(function(){

if(wordsDone%10===0){

bar.style.width="0%";
}

},250);
}

answer.addEventListener("keydown",function(e){

if(e.key==="Enter"){

if(!playing){

startGame();

return;
}

const typed=answer.value.trim().toLowerCase();

if(typed===currentWord.toLowerCase()){

correct();

}else{

wrong();
}
}
});

answer.addEventListener("input",function(){

if(!playing)return;

const typed=answer.value.trim().toLowerCase();

if(typed===currentWord.toLowerCase()){

correct();
}
});

function updateHud(){

levelText.textContent=level;

scoreText.textContent=score;

streakText.textContent=streak;

timeText.textContent=time;

wordsDoneText.textContent=wordsDone;
}

nextWord();

updateHud();

</script>

</body>
</html>
